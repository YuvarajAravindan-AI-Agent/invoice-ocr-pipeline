name: CI

on:
  push:
    branches: [ main, feat/*, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system deps for docker-compose builds
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev gcc

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          pip install pytest requests httpx httpx2 sqlmodel sqlalchemy fastapi uvicorn python-multipart psycopg2-binary

      - name: Run unit + integration tests
        run: pytest -q

      - name: Build and start docker-compose stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:9000/health; then
              echo OK && break
            fi
            sleep 1
          done

      - name: Run e2e tests
        run: pytest tests/e2e/test_compose_end_to_end.py -q

      - name: Tear down compose
        if: always()
        run: docker compose down -v
