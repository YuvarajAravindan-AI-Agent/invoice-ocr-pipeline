# Neutral infrastructure contract for invoice-ocr-pipeline.
#
# Describes REQUIREMENTS and CAPABILITIES, not resources. It is never
# applied directly to a cloud API — each provider adapter under iac/
# reads this (or a generated var-file derived from it) and supplies its
# own resource types.
#
# Rules:
#   - Use capability names: linux_http_service, relational_database,
#     object_storage, secret_store, queue, scheduler.
#   - Use portable units: vCPU, GiB, replica count, HTTPS, engine
#     version, retention days.
#   - Never put credentials, project IDs, account IDs, or
#     environment-specific state here — use environments/*.yaml overlays
#     for region/SKU/limits instead.

application:
  name: invoice-ocr-pipeline
  version: "0.1.0"

compute:
  # API service: accepts invoice uploads, exposes extraction results.
  capability: linux_http_service
  cpu: 2
  memory_gib: 4
  disk_gib: 20
  replicas: 1

  # OCR/extraction worker: consumes the queue below, runs the inference
  # step. Sized higher than the API — OCR/ML inference is the expensive
  # part of this service.
  worker:
    capability: linux_http_service # containerized worker, no inbound HTTP
    cpu: 4
    memory_gib: 8
    disk_gib: 20
    replicas: 1

network:
  ingress: https
  public_ssh: false

storage:
  object_storage:
    # Raw invoice uploads (PDF/image) land here before OCR; keep keys
    # provider-independent per docs/architecture.md.
    retention_days: 90

queue:
  # Decouples upload from OCR/extraction so the worker can scale
  # independently of the API and retries don't block ingestion.
  name: invoice-extraction-jobs
  dead_letter: true

data:
  relational_database:
    # Extracted structured invoice data (vendor, line items, totals,
    # confidence scores) lands here for downstream consumption.
    engine: postgresql
    major_version: "16"
    storage_gib: 20

operations:
  logs: structured_json
  telemetry: opentelemetry
  backups: daily
  deployment: rolling
  pipeline: github_actions
